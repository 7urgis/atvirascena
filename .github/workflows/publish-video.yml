name: Publish submitted video

on:
  issues:
    types: [opened, edited]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: publish-submitted-videos
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.state == 'open' && contains(github.event.issue.body, '### YouTube URL')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Validate and create video content
        id: publish
        run: node scripts/publish-submission.mjs "$GITHUB_EVENT_PATH" .

      - name: Commit published video
        if: steps.publish.outputs.status == 'published'
        env:
          VIDEO_ID: ${{ steps.publish.outputs.video_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/videos/${VIDEO_ID}.md" data/live.json
          git commit -m "Add submitted concert video ${VIDEO_ID}"
          git push

      - name: Start website deployment
        if: steps.publish.outputs.status == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-atvirascena.yml --ref master

      - name: Reply to submission
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          PUBLISH_MESSAGE: ${{ steps.publish.outputs.message }}
        run: gh issue comment "$ISSUE_URL" --body "$PUBLISH_MESSAGE"

      - name: Close handled submission
        if: steps.publish.outputs.status == 'published' || steps.publish.outputs.status == 'duplicate' || steps.publish.outputs.status == 'rate_limited'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh issue close "$ISSUE_URL"

      - name: Report metadata failure
        if: steps.publish.outputs.status == 'metadata_unavailable'
        run: |
          echo "::error::YouTube metadata lookup failed after three attempts. No video was published or deployed. See the validation step for details. Re-run this workflow to retry."
          exit 1
