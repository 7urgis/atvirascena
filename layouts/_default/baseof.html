<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <meta name="color-scheme" content="light dark">
    <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
    <link rel="preconnect" href="https://i.ytimg.com">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    <script src="{{ "js/site.js" | relURL }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label=" AtviraScena — pradžia">
        <span class="brand-mark" aria-hidden="true">▶</span>
        <span> AtviraScena</span>
      </a>
      <nav class="header-nav" aria-label="Pagrindinis meniu">
        <a class="header-action live-link" href="{{ "live/" | relURL }}"{{ if eq .Layout "live" }} aria-current="page"{{ end }}><span class="live-dot" aria-hidden="true"></span>Live</a>
        <a class="header-action" href="{{ site.Home.RelPermalink }}#prideti">＋ Pridėti koncertą</a>
      </nav>
    </header>

    {{ block "main" . }}{{ end }}

    <footer class="site-footer">
      <p> AtviraScena · Koncertų vaizdo įrašai lieka „YouTube“ platformoje.</p>
    </footer>
  </body>
</html>
